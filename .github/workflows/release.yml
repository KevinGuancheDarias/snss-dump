name: Release

# On a pushed version tag, build native x64 release binaries for
# Windows and Linux and attach them to the GitHub release as zip assets.
on:
  push:
    tags:
      - 'v*'
  # Manual smoke-test: builds + packages, but never touches the release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            suffix: "pc-windows-msvc"
            build: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            suffix: "unknown-linux-gnu"
            build: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: |
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary
        shell: bash
        run: test -s "target/${{ matrix.target }}/release/snss-dump${{ matrix.ext }}"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cd "target/${{ matrix.target }}/release"
          strip snss-dump 2>/dev/null || true
          mv snss-dump "snss-dump-x86_64-unknown-linux-gnu"
          zip -9 -q "../snss-dump-x86_64-unknown-linux-gnu.zip" "snss-dump-x86_64-unknown-linux-gnu"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          cp snss-dump.exe "snss-dump-x86_64-pc-windows-msvc.exe"
          powershell -NoProfile -Command "Compress-Archive -Force -Path 'snss-dump-x86_64-pc-windows-msvc.exe' -DestinationPath '../snss-dump-x86_64-pc-windows-msvc.zip'"

      - name: Upload release assets
        if: ${{ matrix.build == true }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: 'true'
          files: "target/${{ matrix.target }}/snss-dump-x86_64-${{ matrix.suffix }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after both matrix legs. On a manual dispatch it only reports the
  # builds; on a tag push it additionally attaches a single SHA256SUMS file.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && (contains(needs.build.result, 'success')) }}
    env:
      IS_PUSH: ${{ github.event == 'push' && startsWith(github.ref_name, 'v') }}
    steps:
      - name: Tag push (no-op placeholder, keeps job graph intact for dispatch)
        if: ${{ !fromJSON(IS_PUSH) }}
        run: true

      - name: Compute SHA256SUMS
        if: ${{ fromJSON(IS_PUSH) }}
        id: checksums
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --dir dist --clobber
          (cd dist; sha256sum snss-dump-x86_64-unknown-linux-gnu.zip snss-dump-x86_64-pc-windows-msvc.zip > SHA256SUMS)
          ls -1 dist
          cat dist/SHA256SUMS
          echo "path=dist/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Upload SHA256SUMS to the release
        if: ${{ fromJSON(IS_PUSH) && steps.checksums.outcome == 'success' }}
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --clobber

      - name: Build-only smoke test summary
        if: ${{ !fromJSON(IS_PUSH) }}
        run: |
          echo "# Build-only smoke test"
          echo "Both x64 matrix legs built and packaged without touching the GitHub release."
          echo ""
          echo "- `needs.build.result = ${needs.build.result}` (both matrix legs)"
